services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai-repository-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data/indexes:/app/data/indexes
    networks:
      default:
        aliases:
          - backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai-repository-frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      - backend
